<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f2430" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />

    <!--
      SEO NOTE: the page-specific title, meta description, canonical,
      Open Graph / Twitter tags and JSON-LD are set by react-helmet-async
      inside each page. Do NOT add them here, or every route would
      inherit the homepage metadata.
    -->

    <!--
      Fonts: preconnect to both Google Fonts origins (gstatic needs
      crossorigin because font files are fetched with CORS). The stylesheet
      loads with media="print" and switches to "all" once loaded, so it
      never blocks first paint. display=swap shows fallback text right away.
      Weight ranges (300..700) load one variable font file per family
      instead of one file per weight, and cover every weight the site uses
      (font-light, normal, medium, semibold, bold).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300..700&family=Playfair+Display:ital,wght@0,400..700;1,400..700&display=swap"
      />
    </noscript>

    <!--
      Google Analytics: gtag() only queues events into dataLayer, so the
      real script is loaded when the browser is idle. Events fired before
      it arrives are processed once it loads. setTimeout covers Safari,
      which has no requestIdleCallback.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-4Q4X77WNJ2");

      function loadGTM() {
        var script = document.createElement("script");
        script.async = true;
        script.src = "https://www.googletagmanager.com/gtag/js?id=G-4Q4X77WNJ2";
        document.head.appendChild(script);
      }

      if ("requestIdleCallback" in window) {
        requestIdleCallback(loadGTM, { timeout: 3000 });
      } else {
        setTimeout(loadGTM, 2000);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
